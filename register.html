<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Registration | SwiftDrive Rentals</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="register.css">

    <script src="cript.js" defer></script>
    <script src="register.js" defer></script>
</head>

<body>

    <!-- Navigation Bar -->
    <header class="site-header">
        <div class="container nav-container">

            <a href="index.html" class="logo">
                SwiftDrive Rentals
            </a>

            <nav class="main-nav">
                <a href="index.html">Home</a>
                <a href="vehicles.html">Vehicles</a>
                <a href="about.html">About Us</a>
                <a href="contact.html">Contact</a>
                <a href="login.html" class="nav-button">Login</a>
            </nav>

        </div>
    </header>

    <main>

        <!-- Registration Section -->
        <section class="register-section">

            <div class="register-container">

                <div class="register-card">

                    <div class="register-heading">
                        <h1>Create an Account</h1>

                        <p>
                            Register with SwiftDrive Rentals to book
                            your preferred vehicle.
                        </p>
                    </div>

                    <!-- Registration Form -->
                    <form id="registerForm">

                        <div class="register-form-group">
                            <label for="fullName">Full Name</label>

                            <input
                                type="text"
                                id="fullName"
                                name="fullName"
                                placeholder="Enter your full name"
                                autocomplete="name"
                                required>
                        </div>

                        <div class="register-form-group">
                            <label for="email">Email Address</label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email address"
                                autocomplete="email"
                                required>
                        </div>

                        <div class="register-form-group">
                            <label for="phone">Phone Number</label>

                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="Enter your phone number"
                                autocomplete="tel"
                                required>
                        </div>

                        <div class="register-form-group">
                            <label for="password">Password</label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Create a password"
                                autocomplete="new-password"
                                minlength="8"
                                required>

                            <small>
                                Password must contain at least 8 characters.
                            </small>
                        </div>

                        <div class="register-form-group">
                            <label for="confirmPassword">
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Enter your password again"
                                autocomplete="new-password"
                                minlength="8"
                                required>
                        </div>

                        <div class="register-terms">
                            <label>
                                <input
                                    type="checkbox"
                                    id="agreeTerms"
                                    name="agreeTerms"
                                    required>

                                I agree to the
                                <a href="rental-terms.html">
                                    Terms and Conditions
                                </a>.
                            </label>
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary register-button">
                            Create Account
                        </button>

                        <p
                            id="registerMessage"
                            class="register-message"
                            role="status">
                        </p>

                    </form>

                    <div class="register-login-link">
                        <p>
                            Already have an account?
                            <a href="login.html">Login Here</a>
                        </p>
                    </div>

                </div>

            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <p>
                &copy; <span id="currentYear"></span>
                SwiftDrive Rentals. All rights reserved.
            </p>
        </div>
    </footer>

</body>
</html>
