
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | SwiftDrive Rentals</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="forgot-password.css">

    <script src="cript.js" defer></script>
    <script src="forgot-password.js" defer></script>
</head>
<body>

    <header class="site-header">
        <nav class="navbar">
            <a href="index.html" class="logo">SwiftDrive Rentals</a>

            <button class="menu-toggle" aria-label="Toggle navigation">
                ☰
            </button>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="vehicles.html">Vehicles</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="forgot-page">
        <section class="forgot-card">
            <div class="forgot-icon">🔐</div>

            <h1>Forgot Password?</h1>

            <p class="forgot-description">
                Don't worry! Enter your registered email address.
                We will help you reset your password.
            </p>

            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                    >
                </div>

                <button type="submit" class="reset-btn">
                    Send Reset Link
                </button>

                <p id="formMessage" class="form-message" role="status"></p>
            </form>

            <div class="back-login">
                <a href="login.html">← Back to Login</a>
            </div>

            <p class="register-link">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>
        </section>
    </main>

    <footer class="site-footer">
        <p>
            &copy; <span id="currentYear"></span>
            SwiftDrive Rentals. All rights reserved.
        </p>
    </footer>

</body>
</html>
